<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tether — Phone</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Tether · Phone</h1>
    <p>Share camera, mic, or both over LAN WebRTC.</p>
  </header>
  <main>
    <section id="gate" class="gate" hidden>
      <p class="status" data-state="wait">Enter the pairing code from the PC control page.</p>
      <form id="pair-form" class="pair-form">
        <input id="pair-input" name="code" type="text" inputmode="text" autocomplete="one-time-code"
               maxlength="8" placeholder="Code" required />
        <button class="primary" type="submit">Continue</button>
      </form>
    </section>

    <section id="cam" hidden>
      <fieldset class="mode-picker">
        <legend>Share</legend>
        <label><input type="radio" name="mode" value="video" checked /> Camera</label>
        <label><input type="radio" name="mode" value="audio" /> Mic</label>
        <label><input type="radio" name="mode" value="av" /> Both</label>
      </fieldset>
      <div class="stage" id="preview-wrap">
        <video id="preview" playsinline muted autoplay></video>
      </div>
      <p id="status" class="status" data-state="wait">Idle — pick a mode and tap Start.</p>
      <div class="actions">
        <button id="start" class="primary" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
    </section>
  </main>
  <script src="/phone.js"></script>
</body>
</html>
