<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tether — Control</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="v4l2-banner" class="v4l2-banner" hidden>
    <div class="v4l2-banner-body">
      <p id="v4l2-msg" class="v4l2-msg"></p>
      <code id="v4l2-cmd" class="v4l2-cmd"></code>
    </div>
    <button id="v4l2-copy" type="button">Copy command</button>
  </div>
  <header>
    <h1>Tether · Control</h1>
    <p>Pick which phone feeds the virtual camera. Preview shows the active device. Localhost only.</p>
  </header>
  <main class="control-main">
    <aside class="device-panel">
      <section class="pair-card">
        <h2>Pairing</h2>
        <p class="pair-code" id="pair-code">······</p>
        <p class="pair-url" id="pair-url">Waiting for server…</p>
        <div class="actions">
          <button id="copy-url" type="button">Copy phone URL</button>
        </div>
        <p class="pair-hint" id="pair-hint">Code expires in 10 minutes or after the first phone connects. Control updates automatically.</p>
      </section>
      <h2>Devices</h2>
      <ul id="devices" class="device-list"></ul>
      <p id="device-empty" class="status" data-state="wait">No phones connected</p>
    </aside>
    <section class="preview-panel">
      <div class="stage">
        <video id="remote" playsinline autoplay muted></video>
      </div>
      <p id="status" class="status" data-state="wait">Connecting…</p>
      <p id="stats" class="status"> </p>
    </section>
  </main>
  <script src="/control.js"></script>
</body>
</html>
